  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <audio id="intro-audio" src="/intro.mp3" preload="auto" playsinline webkit-playsinline></audio>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }

      // Pure Automated Background Audio Engine - Zero External Buttons
      (function() {
        var isAudioPlaying = false;
        var hasPlayedSuccessfully = false;
        var audioEl = document.getElementById('intro-audio');
        var HINDI_SCRIPT = 'नमस्ते! मेंहदीपुर बालाजी ऑटोमोबाइल, एचपी फ्यूल हब में आपका हार्दिक स्वागत है। मथुरा-हाथरस हाईवे पर हमारी अत्याधुनिक पेट्रोल पंप पर आपको मिलता है शत-प्रतिशत शुद्ध व प्रमाणित हाई-स्पीड डीजल, पेट्रोल, पॉवर 95, और बीएस-6 वाहनों के लिए ओरिजिनल डीईएफ यूरिया। साथ ही मुफ़्त डिजिटल एयर, नाइट्रोजन, और 24 घंटे साफ़-सुथरे वॉशरूम की उत्तम सुविधा। आपकी हर यात्रा हो सुखद और सुरक्षित। धन्यवाद! ऑनर: शशांक शर्मा।';

        function dispatchAudioState(playing) {
          isAudioPlaying = playing;
          window.dispatchEvent(new CustomEvent('station-audio-state', { detail: { isPlaying: playing } }));
        }

        // Play unmuted at full volume
        function attemptPlay() {
          if (!audioEl) {
            audioEl = document.getElementById('intro-audio');
          }
          if (!audioEl) return Promise.reject(new Error('Audio element not found'));

          if (hasPlayedSuccessfully && !audioEl.paused) {
            return Promise.resolve();
          }

          // Strict requirement: NEVER mute audio in background
          audioEl.muted = false;
          audioEl.volume = 1.0;

          var playPromise = audioEl.play();
          if (playPromise && typeof playPromise.then === 'function') {
            return playPromise.then(function() {
              hasPlayedSuccessfully = true;
              dispatchAudioState(true);
              removeGestureListeners();
            }).catch(function(err) {
              // Browser policy deferred unmuted autoplay until user interaction
              try {
                audioEl.pause();
                audioEl.currentTime = 0;
                audioEl.muted = false;
                audioEl.volume = 1.0;
              } catch (e) {}
            });
          }
          return Promise.resolve();
        }

        // Unmute and play on the very first user contact (touch, scroll, click, tap, pointer move)
        function onGesture() {
          if (!audioEl) {
            audioEl = document.getElementById('intro-audio');
          }
          if (hasPlayedSuccessfully && audioEl && !audioEl.paused) {
            removeGestureListeners();
            return;
          }

          if (audioEl) {
            audioEl.muted = false;
            audioEl.volume = 1.0;
          }

          // Resume Web Audio Context if suspended
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              var ctx = window.__audioCtx || new AudioCtx();
              window.__audioCtx = ctx;
              if (ctx.state === 'suspended') {
                ctx.resume().catch(function() {});
              }
            }
          } catch (e) {}

          attemptPlay();
        }

        var gestureEvents = [
          'pointerdown', 'touchstart', 'touchend', 'mousedown', 'mouseup', 'click',
          'scroll', 'wheel', 'keydown', 'visibilitychange', 'focus', 'pointermove'
        ];

        function addGestureListeners() {
          gestureEvents.forEach(function(evt) {
            window.addEventListener(evt, onGesture, { capture: true, passive: true });
            document.addEventListener(evt, onGesture, { capture: true, passive: true });
          });
        }

        function removeGestureListeners() {
          gestureEvents.forEach(function(evt) {
            window.removeEventListener(evt, onGesture, true);
            document.removeEventListener(evt, onGesture, true);
          });
        }

        // Audio element events
        if (audioEl) {
          audioEl.muted = false;
          audioEl.volume = 1.0;
          audioEl.addEventListener('playing', function() {
            hasPlayedSuccessfully = true;
            dispatchAudioState(true);
            removeGestureListeners();
          });
          audioEl.addEventListener('pause', function() {
            dispatchAudioState(false);
          });
          audioEl.addEventListener('ended', function() {
            dispatchAudioState(false);
          });
          audioEl.addEventListener('error', function() {
            if ('speechSynthesis' in window) {
              try {
                window.speechSynthesis.cancel();
                var utter = new SpeechSynthesisUtterance(HINDI_SCRIPT);
                utter.lang = 'hi-IN';
                utter.rate = 0.95;
                window.speechSynthesis.speak(utter);
              } catch (e) {}
            }
          });
        }

        // Global programmatic controls
        window.playStationIntro = function() {
          return attemptPlay();
        };

        window.pauseStationIntro = function() {
          if (audioEl) {
            audioEl.pause();
          }
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          dispatchAudioState(false);
        };

        window.isStationIntroPlaying = function() {
          return audioEl ? (!audioEl.paused && !audioEl.muted) : false;
        };

        // Initialize immediately
        addGestureListeners();
        attemptPlay();

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            attemptPlay();
          });
        }

        window.addEventListener('load', function() {
          attemptPlay();
        });

        window.addEventListener('pageshow', function() {
          attemptPlay();
        });
      })();
    </script>
